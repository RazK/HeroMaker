[pytest]
# tests/: in-process unit tests. No server, no network, no API keys.
# The whole flow against a live deployment is the staging robot
# (e2e/staging-robot.mjs).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

