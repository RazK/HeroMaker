[pytest]
# Two suites, deliberately separate:
#   tests/      - in-process unit tests. No server, no network, no API keys.
#                 These are what `python -m pytest` must keep green.
#   app/tests/  - end-to-end tests that drive a LIVE API on localhost:8000 and
#                 spend real money at OpenAI and Meshy. They collect to nothing
#                 unless someone adds a test_*.py there.
testpaths = tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

