# Railway Configuration for Backend Service
# This file is automatically applied when deploying from backend/ directory

[build]
builder = "DOCKERFILE"
rootDirectory = "backend"
dockerfilePath = "Dockerfile"
dockerContext = "."

[deploy]
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables (set these in Railway dashboard or via CLI)
# DATABASE_URL=sqlite:////app/data/db/heromaker.db
# FILES_ROOT=/app/data/files
# OPENAI_API_KEY=your_key_here
# MESHY_API_KEY=your_key_here
# DEBUG=false
# OPENAI_IMAGE_MODEL=gpt-image-1
# OPENAI_IMAGE_MODEL_FALLBACK=
# ALLOWED_ORIGINS=https://heromaker.up.railway.app
# VRM_CONVERTER_SERVICE_URL=http://vrm-converter:8000
# VRM_CONVERTER_TIMEOUT=300

