# Railway Configuration for Backend Service
# This file is automatically applied when deploying from backend/ directory
#
# NOTE: Volumes must be configured once via Railway dashboard:
#   - Go to Backend service → Volumes tab
#   - Mount volume at: /app/data
#   - Use the SAME volume for VRM converter service

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
dockerContext = "backend"

[deploy]
startCommand = ""
healthcheckPath = "/health"
# Migrations run before the server listens, and may wait up to ~60 s for a
# lock the backend being replaced still holds (app/migrations/runner.run_ddl).
healthcheckTimeout = 120
# SIGTERM to SIGKILL for the deploy being replaced. Railway's default is 0: the
# old process would be killed before uvicorn could drain (up to 20 s,
# --timeout-graceful-shutdown in backend/Dockerfile) and the lifespan shutdown
# refund the steps it cuts off (startup_reconcile.interrupt_running, ~5 s).
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables are NOT listed here — they live in
# devops/railway/env/ (common.env + backend.env), declared once for both
# staging and production, and are pushed with:
#   ./devops/scripts/railway-env.sh sync -e <environment> -s backend

