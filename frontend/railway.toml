# Railway Configuration for Frontend Service
# This file is automatically applied when deploying from frontend/ directory

[build]
builder = "DOCKERFILE"
dockerfilePath = "frontend/Dockerfile"
dockerContext = "frontend"

[deploy]
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables are NOT listed here — they live in
# devops/railway/env/ (common.env + frontend.env), declared once for both
# staging and production, and are pushed with:
#   ./devops/scripts/railway-env.sh sync -e <environment> -s frontend

