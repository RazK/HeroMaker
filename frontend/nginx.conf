server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Serve manifest with correct MIME type
    location ~* \.webmanifest$ {
        add_header Content-Type "application/manifest+json";
        expires 1d;
        add_header Cache-Control "public";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend (^~ prevents regex locations from overriding)
    location ^~ /api/ {
        # When this environment borrows another environment's API (staging
        # reading production while it has no data of its own), everything must
        # be read-only. Otherwise Delete, Restart and Redo in a throwaway
        # environment would destroy real data.
        ${API_METHOD_GUARD}

        # Re-resolve the backend instead of pinning its address at startup.
        #
        # nginx resolves a literal proxy_pass hostname exactly once, when it
        # loads. Every backend deploy gives the container a new address, so the
        # frontend kept serving 504s against the old one - the site looked
        # healthy, the backend was healthy, and /api/* was dead until the
        # frontend happened to be redeployed too. Twice in one afternoon.
        #
        # A variable in proxy_pass forces a lookup per request, honouring the
        # TTL below. The resolver comes from the container's own resolv.conf so
        # this works for a public hostname and for Railway's IPv6-only private
        # DNS alike.
        ${API_RESOLVER}
        set $api_upstream ${API_PROXY_TARGET};
        proxy_pass $api_upstream;
        # When the upstream is an https URL (e.g. a non-production environment
        # borrowing another environment's API), the Host header and SNI must be
        # the upstream's own name, not this site's, or TLS and routing fail.
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_PROXY_SNI};
        proxy_set_header Host ${API_PROXY_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

