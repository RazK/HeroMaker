<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroMaker - 3D Avatar Creator</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/scenes.css">
    <link rel="stylesheet" href="css/ui-overlays.css">
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- UI Overlays -->
    <div id="ui-overlay" class="ui-overlay">
        <!-- Content blocks will be added dynamically -->
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Main App (loads all dependencies via imports) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
