name: Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  BACKEND_SERVICE_ID: 3970a673-db5b-4b2d-9456-93acf1da09bf

jobs:
  backup:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Database Backup
        run: |
          railway run --service=${{ env.BACKEND_SERVICE_ID }} python scripts/backup_database.py

      - name: Backup Summary
        run: |
          echo "✅ Database backup completed" >> $GITHUB_STEP_SUMMARY
          echo "📅 Backup time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
