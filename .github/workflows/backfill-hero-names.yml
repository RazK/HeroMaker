name: Backfill hero names (staging)

# Names completed heroes that have no name, with the same OpenAI naming the
# pipeline now runs (backend/scripts/backfill_hero_names.py). STAGING ONLY:
# it uses RAILWAY_STAGING_TOKEN, which cannot reach production. Production
# gets its own run only with Raz's explicit yes.
#
# Runs on the GitHub runner with the backend's staging variables injected by
# `railway run`; the database is reached through its public TCP proxy, as in
# backup.yml.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be named; no OpenAI calls, no writes'
        type: boolean
        default: true
      limit:
        description: 'Name at most this many (empty = all)'
        required: false
        default: ''

jobs:
  config:
    uses: ./.github/workflows/railway-config.yml

  backfill:
    needs: config
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      SERVICE: ${{ needs.config.outputs.backend }}
      ENVIRONMENT: ${{ needs.config.outputs.staging }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm install -g @railway/cli
      - name: Resolve the staging database's public URL
        run: |
          set -euo pipefail
          url=$(railway variables --service Postgres --environment "$ENVIRONMENT" --json | jq -r '.DATABASE_PUBLIC_URL // empty')
          if [ -z "$url" ]; then echo "::error::No DATABASE_PUBLIC_URL on staging Postgres."; exit 1; fi
          echo "::add-mask::$url"
          echo "PUBLIC_DB=$url" >> "$GITHUB_ENV"
      - name: Backfill
        env:
          DRY: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--database-url "$PUBLIC_DB")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          railway run --service="$SERVICE" --environment="$ENVIRONMENT" -- python backend/scripts/backfill_hero_names.py "${args[@]}"
