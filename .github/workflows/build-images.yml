name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Detect which directories have changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      vrm-converter: ${{ steps.filter.outputs.vrm-converter }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            vrm-converter:
              - 'vrm-converter-service/**'

  build-backend:
    needs: changes
    # Build if: backend changed, OR it's a tag/release, OR manual trigger
    if: needs.changes.outputs.backend == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vrm-converter:
    needs: changes
    if: needs.changes.outputs.vrm-converter == 'true' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/vrm-converter
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./vrm-converter-service
          file: ./vrm-converter-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VRM_CONVERTER_VERSION || '1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Railway service and environment IDs, read from devops/railway/project.json
  config:
    needs: changes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/railway-config.yml

  # Merging to main deploys to STAGING, never production. Production is reached
  # only through .github/workflows/promote-production.yml, which waits for a
  # human to approve it. That is the whole point: main is what staging runs, and
  # what production may become.
  #
  # All three services deploy on every merge, even one that changed no service
  # code, so staging is always exactly main rather than "main, plus whichever
  # services happened to change since someone last looked".
  deploy-staging:
    needs: [changes, config, build-backend, build-frontend, build-vrm-converter]
    # always() so a skipped build (no changes in that service) does not skip the
    # deploy, but config must actually have succeeded — a skipped config job
    # would leave every ID empty and deploy to whatever Railway defaults to.
    if: |
      always() && !cancelled() && !failure()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.config.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: staging
    timeout-minutes: 15
    env:
      # NOT secrets.RAILWAY_TOKEN. That one is a Railway *project* token scoped
      # to production — CI proved it: `railway whoami` returns Unauthorized
      # while `railway status` reports Environment: production. A token scoped
      # to one environment cannot deploy to another under any name, which is
      # why two attempts at --environment failed before this was understood.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      TARGET_ENVIRONMENT: ${{ needs.config.outputs.staging }}
      # Booleans, never the values: GitHub cannot list its own secrets back, so
      # this is how a run reports which of the two are actually configured.
      STAGING_TOKEN_SET: ${{ secrets.RAILWAY_STAGING_TOKEN != '' }}
      PRODUCTION_TOKEN_SET: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fail with the actual remedy rather than Railway's "Environment not
      # found", which sent this pipeline down the wrong path twice.
      - name: Require a staging-scoped Railway token
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error title=RAILWAY_STAGING_TOKEN is not set::Staging deploys need their own Railway token. RAILWAY_TOKEN is a project token scoped to production and cannot reach staging. Create a token scoped to the staging environment (Railway -> hero-maker -> Settings -> Tokens) and add it to this repository as the secret RAILWAY_STAGING_TOKEN. See docs/deployment/cicd.md."
            exit 1
          fi

      # Kept because it earned its place: this is what identified the token as
      # environment-scoped. Everything is wrapped in `timeout` because a
      # Railway CLI subcommand that wants a TTY would otherwise hang the job,
      # and in `|| true` because the diagnosis must not replace the real error.
      - name: Preflight — what can this token reach?
        run: |
          echo "Secrets configured on this repository:"
          echo "  RAILWAY_STAGING_TOKEN (staging):    ${STAGING_TOKEN_SET}"
          echo "  RAILWAY_TOKEN (production):         ${PRODUCTION_TOKEN_SET}"
          echo ""
          echo "::group::railway whoami"
          timeout 30 railway whoami 2>&1 || true
          echo "::endgroup::"
          echo "::group::railway status"
          timeout 30 railway status 2>&1 || true
          echo "::endgroup::"
          echo "::group::railway status --json"
          timeout 30 railway status --json 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "Targeting environment: '${TARGET_ENVIRONMENT}'"
          echo "This job uses RAILWAY_STAGING_TOKEN. If the deploy below still"
          echo "reports the environment 'not found', then either that token is"
          echo "not scoped to staging, or the environment is not named"
          echo "'${TARGET_ENVIRONMENT}' — the status above says which it is."

      - name: Deploy Backend
        run: railway up --service=${{ needs.config.outputs.backend }} --environment=${{ needs.config.outputs.staging }} --detach

      - name: Deploy Frontend
        run: railway up --service=${{ needs.config.outputs.frontend }} --environment=${{ needs.config.outputs.staging }} --detach

      - name: Deploy VRM Converter
        run: railway up --service=${{ needs.config.outputs.vrm_converter }} --environment=${{ needs.config.outputs.staging }} --detach

      - name: Deployment Summary
        run: |
          {
            echo "## 🚧 Deployed to STAGING"
            echo ""
            echo "Commit \`${GITHUB_SHA:0:7}\` is now running in the staging environment."
            echo ""
            echo "- ✅ Backend"
            echo "- ✅ Frontend"
            echo "- ✅ VRM Converter"
            echo ""
            echo "Production is unchanged. Once this looks right in staging, promote it:"
            echo "**Actions → Promote to production → Run workflow**, with ref \`${GITHUB_SHA}\`."
          } >> $GITHUB_STEP_SUMMARY

  # Summary job that depends on all builds (for PR status checks)
  summary:
    needs: [changes, build-backend, build-frontend, build-vrm-converter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.changes.outputs.backend }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "- ✅ Backend: Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Backend: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.changes.outputs.frontend }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "- ✅ Frontend: Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Frontend: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.changes.outputs.vrm-converter }}" == "true" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "- ✅ VRM Converter: Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ VRM Converter: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
