name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Detect which service directories have changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      vrm-converter: ${{ steps.filter.outputs.vrm-converter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            vrm-converter:
              - 'vrm-converter-service/**'

  # ── Production deploys (push to main only) ─────────────────────────────────

  deploy-backend-production:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Railway production
        run: railway up --service=${{ secrets.RAILWAY_BACKEND_SERVICE_ID }} --environment=production --detach

  deploy-vrm-production:
    needs: changes
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.vrm-converter == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy VRM converter to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
        working-directory: ./vrm-converter-service

  # ── Staging deploy (PRs only) ───────────────────────────────────────────────
  # Frontend preview is handled automatically by Cloudflare Pages.
  # We only need to deploy the backend to Railway staging.

  deploy-backend-staging:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Railway staging
        run: railway up --service=${{ secrets.RAILWAY_BACKEND_SERVICE_ID }} --environment=staging --detach
      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Preview deployed**\n\nFrontend: Cloudflare Pages will post the preview URL above.\nBackend (staging): See Railway dashboard for the staging backend URL.'
            })
