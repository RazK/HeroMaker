services:
  # Backend API Service
  backend:
    build:
      context: ./vrm-converter-service/backend
      dockerfile: Dockerfile
    container_name: heromaker-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/db/heromaker.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MESHY_API_KEY=${MESHY_API_KEY}
      - DEBUG=true
      - FILES_ROOT=/app/data/files
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1}
      - OPENAI_IMAGE_MODEL_FALLBACK=${OPENAI_IMAGE_MODEL_FALLBACK:-}
      - VRM_CONVERTER_SERVICE_URL=${VRM_CONVERTER_SERVICE_URL:-http://vrm-converter:8000}
      - VRM_CONVERTER_TIMEOUT=${VRM_CONVERTER_TIMEOUT:-300}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      # Mount data directory (contains users/ and db/ subdirectories)
      - ./data:/app/data
      # Mount backend code for hot reload (development only)
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - heromaker-network

  # Frontend Web Application
  frontend:
    build:
      context: ./vrm-converter-service/frontend
      dockerfile: Dockerfile
    container_name: heromaker-frontend
    ports:
      - "3000:80"  # Frontend (nginx in production, Vite dev server in development)
      - "5173:5173"  # Vite dev server port (for local dev outside Docker)
    depends_on:
      - backend
    environment:
      - DEBUG=true
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_DEV_PORT=80
    volumes:
      # Mount frontend source for hot reload (development only)
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules in container
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - heromaker-network

  # VRM Converter Service
  vrm-converter:
    build:
      context: ./vrm-converter-service
      dockerfile: Dockerfile
      args:
        VERSION: ${VRM_CONVERTER_VERSION:-1.0.0}
    image: vrm-converter-service:${VRM_CONVERTER_VERSION:-1.0.0}
    container_name: vrm-converter-service
    ports:
      - "8001:8000"
    environment:
      - BLENDER_PATH=/usr/bin/blender
      - DEBUG=true
    volumes:
      # Mount data directory so VRM converter can access GLB files and write VRM files
      - ./data:/app/data
      # Mount vrm-converter code for hot reload (development only)
      - ./vrm-converter-service/app.py:/app/app.py
      - ./vrm-converter-service/conversion_script.py:/app/conversion_script.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (Blender can be memory-intensive)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    networks:
      - heromaker-network

networks:
  heromaker-network:
    driver: bridge

