services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heromaker-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./heromaker.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MESHY_API_KEY=${MESHY_API_KEY}
      - DEBUG=${DEBUG:-false}
      - ASSETS_ROOT=/app/assets
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1}
      - OPENAI_IMAGE_MODEL_FALLBACK=${OPENAI_IMAGE_MODEL_FALLBACK:-}
      - VRM_CONVERTER_SERVICE_URL=${VRM_CONVERTER_SERVICE_URL:-http://vrm-converter:8000}
      - VRM_CONVERTER_TIMEOUT=${VRM_CONVERTER_TIMEOUT:-300}
    volumes:
      # Mount assets directory for file storage
      - ./assets:/app/assets
      # Mount database file for persistence
      - ./backend/heromaker.db:/app/heromaker.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - heromaker-network

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heromaker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - heromaker-network

  # VRM Converter Service
  vrm-converter:
    build:
      context: .
      dockerfile: ./vrm-converter-service/Dockerfile
      args:
        VERSION: ${VRM_CONVERTER_VERSION:-1.0.0}
    image: vrm-converter-service:${VRM_CONVERTER_VERSION:-1.0.0}
    container_name: vrm-converter-service
    ports:
      - "8002:8000"
    environment:
      - BLENDER_PATH=/usr/bin/blender
    volumes:
      # Mount assets directory so VRM converter can access GLB files and write VRM files
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (Blender can be memory-intensive)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    networks:
      - heromaker-network

networks:
  heromaker-network:
    driver: bridge

