<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HeroMaker ad 01</title>
<!-- Ad 01 (docs/content/scripts/ad-01-it-comes-alive.md), on Maya's grid
     (docs/content/ad-storyboard.md, "Maya's notes"). Recorded frame by frame by
     games/hero-moves/tools/ad-record.mjs: window.__ad.set(t) poses every layer for
     second t; nothing here runs on a clock.

     Grid, in 9:16 pixels (1080 x 1920; 4:5 is the same grid scaled to 1350 tall):
       caption slot  y 312-480, one size, never moves
       visual band   y 528-1488
       TikTok rail   x 912-1056, y 900-1536: always empty (9:16 only)
     One centre axis, x 540. Two fonts: Barriecito (the caption, the sentences),
     Nunito (the button). -->
<link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --cream: #fff6e9; --ink: #231942; --ink-2: #5c5578; --grape: #5b3df5; --grape-deep: #3a22b8; --white: #fff; }
  html, body { margin: 0; background: var(--cream); overflow: hidden; }
  #ad { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; background: var(--cream); color: var(--ink); overflow: hidden; }
  .abs { position: absolute; }
  #cap { left: 0; right: 0; top: 312px; height: 168px; display: flex; align-items: center; justify-content: center; font-family: Barriecito, sans-serif; font-size: 112px; line-height: 1; }
  /* The gallery polaroid (.tb-pol): white, padded, rounded, -4deg at rest here -3. */
  #pol { background: var(--white); border-radius: 3.5%; box-shadow: 0 10px 28px rgba(35, 25, 66, .18); transform-origin: 50% 50%; }
  #pol img { position: absolute; display: block; }
  #pol span { position: absolute; left: 0; right: 0; text-align: center; font-family: Barriecito, sans-serif; color: var(--ink-2); line-height: 1; }
  #painted, #vrow { object-fit: contain; }
  .arrow { color: var(--grape); overflow: visible; }
  #call { border-radius: 32px; overflow: hidden; box-shadow: 0 16px 40px rgba(35, 25, 66, .22); }
  #call img { position: absolute; display: block; }
  .sent { text-align: center; white-space: nowrap; font-family: Barriecito, sans-serif; font-size: 46px; line-height: 1; }
  #btn { left: 290px; width: 500px; height: 124px; border-radius: 999px; background: var(--grape); color: var(--white); box-shadow: 0 10px 0 var(--grape-deep); display: flex; align-items: center; justify-content: center; font-family: Nunito, sans-serif; font-weight: 800; font-size: 54px; }
</style>
</head>
<body>
<div id="ad">
  <div id="cap" class="abs"></div>
  <svg id="a1" class="abs arrow" viewBox="2 6 54 24"><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M44 11 L52 18 L44 25"/></svg>
  <svg id="a2" class="abs arrow" viewBox="2 6 54 24"><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M44 11 L52 18 L44 25"/></svg>
  <img id="painted" class="abs" src="assets/violet-cut.png" alt="" />
  <img id="vrow" class="abs" alt="" />
  <img id="violet" class="abs" alt="" />
  <div id="call" class="abs"><img id="girl" alt="" /></div>
  <div id="pol" class="abs"><img id="drawon" alt="" /><span>Maya, 7</span></div>
  <div id="s1" class="abs sent">You draw it.</div>
  <div id="s2" class="abs sent">We paint it.</div>
  <div id="s3" class="abs sent">It comes alive!</div>
  <div id="btn" class="abs">Make a hero</div>
</div>
<script>
const q = new URLSearchParams(location.search)
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920)
const FEED = H / W < 1.5   // 4:5: the same grid, scaled to 1350 tall, call side by side
// Work in 9:16 units; 4:5 squeezes y only where the grid says so (see Y()).
const ad = document.getElementById('ad')
ad.style.width = W + 'px'; ad.style.height = H + 'px'
const Y = (y) => y * H / 1920   // the grid's y, scaled to this height
const $ = (id) => document.getElementById(id)
const clamp = (x) => Math.max(0, Math.min(1, x))
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3) }
const lerp = (a, b, k) => a + (b - a) * k
const box = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })

const DRAW_N = +(q.get('drawN') || 1), DRAW_FPS = 24
const CLIP_N = 81, CLIP_FPS = 16
const pad4 = (i) => String(i).padStart(4, '0')

// Beats (s): 1 the drawing draws itself, 2 into the row + painting, 3 alive + call, 4 row + button.
const B = { b1: 0, b2: 3.5, b3: 5.0, b4: 10.0, end: 12.0 }
const DRAW_SPEED = (DRAW_N / DRAW_FPS) / (B.b2 - 0.3)   // the whole draw-on fits beat 1

// Where each step lives. 4:5: a row of three 280 px slots and two 96 px arrows,
// centred in the visual band. 9:16 (Maya, option A): a column on the axis,
// top to bottom, arrows pointing down, filling y 528-1488 and clear of the rail.
const SLOT = 280, ARW = 96
const POL_R = 1.1                       // a polaroid is 10% taller than wide
let L
if (FEED) {
  const rowX = (W - (3 * SLOT + 2 * ARW)) / 2
  const cy = (Y(528) + Y(1488)) / 2 - 40       // the row and its sentences, centred
  const top = cy - SLOT * POL_R / 2
  const sx = (i) => rowX + i * (SLOT + ARW)
  L = {
    slot: [0, 1, 2].map((i) => [sx(i), top, SLOT, SLOT * POL_R]),
    arrow: [0, 1].map((i) => [rowX + SLOT + i * (SLOT + ARW) + 10, top + SLOT * POL_R / 2 - 22, ARW - 20, 44, 0]),
    sent: [0, 1, 2].map((i) => [sx(i), top + SLOT * POL_R + 24, SLOT, 50, 'center']),
    btnY: top + SLOT * POL_R + 24 + 50 + 64,
  }
} else {
  // 300 + 64 + 260 + 64 + 260 = 948 of the band's 960, centred in it.
  const hs = [300, 64, 260, 64, 260], gap = (960 - hs.reduce((a, b) => a + b)) / 2
  let y = 528 + gap
  const ys = hs.map((h) => { const v = y; y += h; return v })
  const pic = (i, h) => [(W - h / POL_R) / 2, ys[i], h / POL_R, h]
  L = {
    slot: [pic(0, 300), pic(2, 260), pic(4, 260)],
    arrow: [1, 3].map((i) => [W / 2 - 38, ys[i] + 6, 76, 52, 90]),
    sent: [],
    btnY: 0,
  }
  // Beat 4: each picture with its sentence beside it; the pair is centred on the axis.
  const PW = 230, TW = 400, G = 32, x0 = (W - (PW + G + TW)) / 2
  const rows = [0, 1, 2].map((i) => 528 + 40 + i * 300)
  L.end = {
    slot: rows.map((ry) => [x0, ry, PW, PW * POL_R]),
    sent: rows.map((ry) => [x0 + PW + G, ry + PW * POL_R / 2 - 30, TW, 60, 'left']),
    btnY: 528 + 40 + 3 * 300 + 24,
  }
}
const lerpBox = (a, b, k) => a.map((v, i) => (typeof v === 'number' ? lerp(v, b[i], k) : v))

// Wavy arrow paths (the landing's: a straight line a sine wave travels along).
const wave = (phase) => {
  const pts = []
  for (let k = 0; k <= 40; k++) {
    const s = k / 40, y = 18 + 3.6 * Math.sin(Math.PI * s) ** 2 * Math.sin(2 * Math.PI * 2 * s - phase)
    pts.push(`${(6 + 46 * s).toFixed(2)} ${y.toFixed(2)}`)
  }
  return 'M' + pts.join(' L')
}

function img(el, url) { if (el.getAttribute('src') !== url) el.src = url; return el.decode ? el.decode().catch(() => {}) : null }

window.__ad = {
  duration: B.end,
  async set(t) {
    const waits = []
    // ---- the one caption slot ------------------------------------------------
    const cap = t < B.b2 ? 'You draw it.' : t < B.b3 ? 'We paint it.' : t < B.b4 ? 'It comes alive!' : ''
    $('cap').textContent = cap
    Object.assign($('cap').style, { top: Y(312) + 'px', height: Y(168) + 'px', fontSize: (FEED ? 96 : 112) + 'px' })

    const k4 = ease((t - B.b4) / 0.6)
    const atEnd = t >= B.b4
    const slots = !FEED && atEnd ? L.slot.map((r, i) => lerpBox(r, L.end.slot[i], k4)) : L.slot

    // ---- the polaroid: one element, big in beat 1, then its place in the steps
    // 740 px wide in 9:16: the widest that stays clear of the rail on the axis.
    const bw = FEED ? 600 : 740, bh = bw * POL_R
    const big = [(W - bw) / 2, Y(528) + (Y(1488) - Y(528) - bh) / 2, bw, bh]
    const k2 = ease((t - B.b2) / 0.7)
    const [px, py, pw, ph] = lerpBox(big, slots[0], k2)
    box($('pol'), px, py, pw, ph)
    $('pol').style.transform = `rotate(${lerp(-3, -4, k2)}deg)`
    const padP = pw * 0.045
    box($('drawon'), padP, padP, pw - 2 * padP, pw - 2 * padP)
    Object.assign($('pol').querySelector('span').style, { top: (pw - padP + ph * 0.012) + 'px', fontSize: (pw * 0.06) + 'px' })
    const di = Math.min(DRAW_N - 1, Math.floor(t * DRAW_SPEED * DRAW_FPS))
    waits.push(img($('drawon'), `assets/drawon/${pad4(di)}.png`))

    // ---- beat 2: arrows and the painting's cut-out --------------------------
    const stepsFade = t < B.b4 ? 1 - ease((t - B.b3) / 0.6) : k4   // out as Violet grows, back at the end
    const showSteps = t >= B.b2 && (t < B.b3 + 0.6 || atEnd)
    $('pol').style.opacity = t < B.b3 ? 1 : stepsFade
    const a1 = ease((t - B.b2 - 0.5) / 0.4), pa = ease((t - B.b2 - 0.8) / 0.35), a2 = ease((t - B.b2 - 1.1) / 0.4)
    ;[['a1', 0, a1], ['a2', 1, a2]].forEach(([id, i, k]) => {
      const el = $(id), [ax, ay, aw, ah, rot] = L.arrow[i]
      box(el, ax, ay, aw, ah)
      el.style.transform = `rotate(${rot}deg)`
      // 9:16's last step drops the arrows: the pairs read top to bottom on their own.
      el.style.opacity = !showSteps ? 0 : atEnd ? (FEED ? k4 : 1 - k4) : k * stepsFade
      el.querySelector('path').setAttribute('d', wave(t * 2 * Math.PI / 1.6 + i * Math.PI))
    })
    const [qx, qy, qw, qh] = slots[1]
    box($('painted'), qx, qy + (qh - qw) / 2, qw, qw)
    $('painted').style.opacity = showSteps ? (atEnd ? stepsFade : pa * stepsFade) : 0
    $('painted').style.transform = `scale(${atEnd ? 1 : 0.85 + 0.15 * pa})`

    // ---- beat 3: Violet grows out of the third step; the call has its own place
    const k3 = ease((t - B.b3) / 0.8)
    const fi = Math.min(CLIP_N - 1, Math.max(0, Math.floor((t - B.b3) * CLIP_FPS)))
    const vRatio = 520 / 760
    const bandH = Y(1488) - Y(528)
    const vFull = FEED ? [W / 4 - bandH * vRatio / 2, Y(528), bandH * vRatio, bandH] : [(W - bandH * vRatio) / 2, Y(528), bandH * vRatio, bandH]
    const s3 = L.slot[2], vFrom = [s3[0] + (s3[2] - s3[3] * vRatio) / 2, s3[1], s3[3] * vRatio, s3[3]]
    box($('violet'), ...lerpBox(vFrom, vFull, k3))
    $('violet').style.opacity = t >= B.b3 && t < B.b4 + 0.4 ? (t < B.b4 ? 1 : 1 - ease((t - B.b4) / 0.4)) : 0
    if (t >= B.b3 && t < B.b4 + 0.4) waits.push(img($('violet'), `assets/violet/${pad4(fi)}.png`))
    // 9:16: portrait 264x384, bottom-left, under Violet's feet and clear of the rail.
    // 4:5: the right half, beside Violet.
    const cw = FEED ? 400 : 264, ch = FEED ? 400 * 832 / 560 * 0.78 : 384
    const cx = FEED ? W * 3 / 4 - cw / 2 : 64, cy = FEED ? Y(528) + (bandH - ch) / 2 : 1920 - 36 - 384
    box($('call'), cx, cy, cw, ch)
    const kc = ease((t - B.b3 - 0.3) / 0.4)
    $('call').style.opacity = t < B.b4 ? kc : 1 - ease((t - B.b4) / 0.4)
    $('call').style.transform = `scale(${0.9 + 0.1 * kc})`
    const gh = cw * 832 / 560
    box($('girl'), 0, -(gh - ch) * 0.18, cw, gh)
    if (t >= B.b3 - 0.1 && t < B.b4 + 0.4) waits.push(img($('girl'), `assets/girl/${pad4(fi + 1)}.jpg`))

    // ---- beat 4: every step, the sentences once, Make a hero ----------------
    box($('vrow'), ...(FEED ? L.slot[2] : L.end.slot[2]))
    $('vrow').style.opacity = atEnd ? k4 : 0
    if (atEnd) waits.push(img($('vrow'), `assets/violet/${pad4(CLIP_N - 1)}.png`))
    if (atEnd) $('pol').style.opacity = 1
    const sents = FEED ? L.sent : L.end.sent
    ;['s1', 's2', 's3'].forEach((id, i) => {
      const [sx, sy, sw, sh, al] = sents[i]
      box($(id), sx, sy, sw, sh)
      Object.assign($(id).style, { textAlign: al, fontSize: (FEED ? 46 : 60) + 'px', lineHeight: sh + 'px' })
      $(id).style.opacity = atEnd ? ease((t - B.b4 - 0.3 - i * 0.12) / 0.4) : 0
    })
    $('btn').style.top = (FEED ? L.btnY : L.end.btnY) + 'px'
    $('btn').style.opacity = atEnd ? ease((t - B.b4 - 0.7) / 0.4) : 0
    $('btn').style.transform = `scale(${atEnd ? 0.92 + 0.08 * ease((t - B.b4 - 0.7) / 0.4) : 1})`
    await Promise.all(waits)
  },
}
</script>
</body>
</html>
