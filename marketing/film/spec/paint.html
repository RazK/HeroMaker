<!doctype html><html><head><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Nunito:wght@700;800&display=swap" rel=stylesheet>
<style>
html,body{margin:0;width:360px;height:640px;background:#e9e3ff;font-family:Nunito}
/* No card. The painting IS the frame: full bleed on lilac; caption top band; name tag 24 px from the left and bottom edges. */
.cap{position:absolute;top:0;left:0;right:0;height:96px;background:#fff6e9;display:flex;align-items:center;justify-content:center;font-family:Barriecito;font-size:34px;color:#231942}
.p{position:absolute;top:96px;left:0;right:0;bottom:96px;display:flex;align-items:center;justify-content:center}
.p img{max-width:312px;max-height:440px}
.tag{position:absolute;left:24px;bottom:24px;background:#fff;border-radius:16px;padding:8px 14px;box-shadow:0 2px 8px rgba(35,25,66,.12)}
.tag b{display:block;font-family:Barriecito;font-weight:400;font-size:20px;color:#231942}
.tag small{font-weight:700;font-size:13px;color:#5c5578}
</style></head><body>
<div class="cap">We paint it.</div><div class="p"><img src="painted.png"></div>
<div class="tag"><b>Violet Volt</b><small>by Maya, 6</small></div>
</body></html>
