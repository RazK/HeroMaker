<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Moves — backdrop lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a12; overflow: hidden; }
  #app, #app canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* The caption sits on its own plate: text over a rendered scene has no
     background to check the contrast of, so it does not float. */
  #plate {
    position: absolute; left: 18px; bottom: 18px; padding: 10px 16px 12px;
    border-radius: 14px; background: rgba(10,8,16,.72);
    box-shadow: 0 6px 26px rgba(0,0,0,.4);
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; color: #fff;
    max-width: min(70vw, 420px);
  }
  #name { font-size: 26px; font-weight: 800; letter-spacing: .01em; }
  #blurb { font-size: 14px; opacity: .82; margin-top: 3px; line-height: 1.35; }
  #cast { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
          opacity: .6; margin-top: 7px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="plate">
  <div id="name">loading…</div>
  <div id="blurb"></div>
  <div id="cast"></div>
</div>
<script type="module" src="/src/backdrops.ts"></script>
</body>
</html>
