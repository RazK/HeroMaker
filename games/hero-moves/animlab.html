<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero Moves — animation lab</title>
<style>
  html, body { margin: 0; background: #20222e; }
  #wrap { position: relative; display: inline-block; line-height: 0; }
  #app canvas { display: block; }
  .plate {
    position: absolute; line-height: 1.25;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.75);
  }
  /* Keeps the caption readable over a hero who may land right on top of it. */
  #scrim {
    left: 0; right: 0; bottom: 0; height: 25%;
    background: linear-gradient(to top, rgba(14,15,21,.92) 8%, rgba(14,15,21,.62) 46%, rgba(14,15,21,0));
  }
  #lower { left: 26px; bottom: 22px; }
  #title { font-size: 40px; font-weight: 800; letter-spacing: .01em; }
  #credit { font-size: 15px; opacity: .78; margin-top: 4px; }
  #topbar { left: 26px; top: 20px; font-size: 15px; letter-spacing: .13em; text-transform: uppercase; opacity: .72; }
  #counter { right: 26px; top: 20px; font-size: 15px; letter-spacing: .13em; opacity: .72; }
  #rule { left: 26px; bottom: 74px; width: 62px; height: 4px; background: #ffd166; border-radius: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="app"></div>
  <div class="plate" id="topbar">HeroMaker · VRM 0.0 avatar <span id="hero"></span></div>
  <div class="plate" id="counter"></div>
  <div class="plate" id="scrim"></div>
  <div class="plate" id="rule"></div>
  <div class="plate" id="lower">
    <div id="title">loading…</div>
    <div id="credit"></div>
  </div>
</div>
<script type="module" src="/src/animlab.ts"></script>
</body>
</html>
