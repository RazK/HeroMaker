# Railway Configuration for VRM Converter Service
# This file is automatically applied when deploying from vrm-converter-service/ directory

[build]
builder = "DOCKERFILE"
dockerfilePath = "vrm-converter-service/Dockerfile"
dockerContext = "vrm-converter-service"

[deploy]
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 60
# SIGTERM to SIGKILL for the deploy being replaced (Railway's default is 0):
# room for uvicorn's 20 s --timeout-graceful-shutdown (Dockerfile).
drainingSeconds = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables are NOT listed here — they live in
# devops/railway/env/ (common.env + vrm-converter.env), declared once for both
# staging and production, and are pushed with:
#   ./devops/scripts/railway-env.sh sync -e <environment> -s vrm-converter

